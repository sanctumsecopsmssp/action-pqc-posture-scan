name: CI
on:
  pull_request: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Lint action metadata
      run: ruby -e "require 'yaml'; metadata = YAML.load_file('action.yml'); abort('missing runs metadata') unless metadata.dig('runs', 'using') == 'composite'; abort('missing composite step') if metadata.dig('runs', 'steps').to_a.empty?"
    - name: Run fixture
      run: |
        python3 scripts/pqc_posture_scan.py --path tests/fixtures --fail-on none --report-format both --report-path tests/fixtures/report.json
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - id: action
      uses: ./
      with:
        path: tests/fixtures
        fail-on: none
        report-format: both
        report-path: pqc-posture-report.json
    - name: Assert outputs
      shell: bash
      run: |
        echo "findings-count=${{ steps.action.outputs.findings-count }}"
        test -n "${{ steps.action.outputs.findings-count }}"
